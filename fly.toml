# fly.toml app configuration file generated for caydiid on 2026-10-07T08:09:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'caydiid'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  MAIL_FROM_NAME = 'Caydiid'
  MAIL_PROVIDER = 'brevo'
  NODE_ENV = 'production'
  PORT = '8080'
  TRUST_PROXY = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
